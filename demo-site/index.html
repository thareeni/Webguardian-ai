<!DOCTYPE html>
<html lang="en">
<head>

<title>Demo Storefront</title>
<style>
  body{font-family:Arial, sans-serif; margin:0; padding:0;}

  .container{max-width:1200px; margin:0 auto; padding:24px;}
  .overflow-box{width:1600px; background:#eee; padding:10px;} /* mobile overflow: intentional */

  <h1>Welcome to the Demo Storefront</h1>
  <img src="/images/hero.png" width="600"> <!-- missing alt + broken src: intentional -->

  <h2>Sign up</h2>
  <form id="signup-form">
    <input type="email" name="email" required placeholder="Email">
    <input type="password" name="password" required placeholder="Password">
