<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGuardian AI — Autonomous QA Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d12;
    --panel: #10151d;
    --panel-line: #1c2430;
    --text: #cdd6e0;
    --text-dim: #6b7686;
    --accent: #4fd1c5;      /* signal cyan - "agent active" */
    --ok: #3fb950;
    --warn: #e3b341;
    --crit: #f85149;
    --high: #f0883e;
    --med: #e3b341;
    --low: #6b9bd1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:14px;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-attachment: fixed;
    background-color: var(--bg);
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px; border-bottom:1px solid var(--panel-line);
    background:rgba(10,13,18,0.85); backdrop-filter: blur(6px);
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand h1{font-size:19px; margin:0; letter-spacing:.5px;}
  .brand .tag{color:var(--text-dim); font-size:12px; margin-top:2px;}
  main{max-width:1180px; margin:0 auto; padding:32px;}

  .panel{background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:22px; margin-bottom:22px;}
  .panel h2{font-size:14px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-dim); margin:0 0 16px;}

  .scan-form{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  input, select{
    background:#0d1218; border:1px solid var(--panel-line); color:var(--text);
    padding:10px 12px; border-radius:6px; font-family:inherit; font-size:13px;
  }
  input#url{width:360px}
  input:focus, select:focus{outline:1px solid var(--accent);}
  button{
    background:var(--accent); color:#04201d; border:none; font-weight:600;
    padding:11px 20px; border-radius:6px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
    letter-spacing:.3px; font-size:13.5px;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5; cursor:not-allowed}

  .score-row{display:flex; gap:16px; flex-wrap:wrap;}
  .score-card{
    flex:1; min-width:140px; background:#0d1218; border:1px solid var(--panel-line);
    border-radius:8px; padding:16px;
  }
  .score-card .num{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700;}
  .score-card .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}

  #log{max-height:340px; overflow-y:auto; display:flex; flex-direction:column-reverse;}
  .log-entry{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--panel-line); font-size:12.5px;}
  .log-entry .icon{width:16px; flex-shrink:0;}
  .log-entry .agent{color:var(--accent); font-weight:600; flex-shrink:0; width:150px;}
  .log-entry .task{color:var(--text);}
  .log-entry .detail{color:var(--text-dim); font-size:11.5px; display:block;}
  .log-entry .ts{color:var(--text-dim); font-size:10.5px; margin-left:auto; flex-shrink:0;}
  .status-running{color:var(--warn)}
  .status-success{color:var(--ok)}
  .status-failed{color:var(--crit)}
  .status-warning{color:var(--high)}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; font-size:10.5px; padding:8px; border-bottom:1px solid var(--panel-line);}
  td{padding:9px 8px; border-bottom:1px solid var(--panel-line); vertical-align:top;}
  .sev{padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; letter-spacing:.5px;}
  .sev-CRITICAL{background:rgba(248,81,73,.15); color:var(--crit);}
  .sev-HIGH{background:rgba(240,136,62,.15); color:var(--high);}
  .sev-MEDIUM{background:rgba(227,179,65,.15); color:var(--med);}
  .sev-LOW{background:rgba(107,155,209,.15); color:var(--low);}
  .empty{color:var(--text-dim); font-style:italic; padding:12px 0;}
  .pill{display:inline-block; padding:2px 8px; border-radius:4px; font-size:10.5px; background:#0d1218; border:1px solid var(--panel-line); color:var(--text-dim);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>WebGuardian AI</h1>
      <div class="tag">Autonomous Website QA & Bug Intelligence — Phase 1</div>
    </div>
  </div>
  <div id="health" class="pill">checking backend…</div>
</header>

<main>

  <div class="panel">
    <h2>New Scan</h2>
    <div class="scan-form">
      <div class="field">
        <label for="url">Website URL</label>
        <input id="url" type="text" placeholder="https://example.com" value="https://example.com" />
      </div>
      <div class="field">
        <label for="maxPages">Max Pages</label>
        <input id="maxPages" type="number" value="8" min="1" max="50" style="width:80px" />
      </div>
      <div class="field">
        <label for="maxDepth">Max Depth</label>
        <input id="maxDepth" type="number" value="2" min="0" max="5" style="width:80px" />
      </div>
      <div class="field">
        <label for="device">Device</label>
        <select id="device">
          <option value="desktop">Desktop</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile</option>
        </select>
      </div>
      <button id="startBtn">▶ Start Autonomous QA Scan</button>
    </div>
  </div>

  <div class="panel" id="scoreboard" style="display:none">
    <h2>Quality Scoreboard</h2>
    <div class="score-row" id="scoreRow"></div>
  </div>

  <div class="panel" id="logPanel" style="display:none">
    <h2>Live Agent Execution</h2>
    <div id="log"></div>
  </div>

  <div class="panel" id="bugsPanel" style="display:none">
    <h2>Bug Explorer</h2>
    <table>
      <thead><tr><th>Severity</th><th>Bug</th><th>Category</th><th>Page</th><th>Why this severity</th></tr></thead>
      <tbody id="bugsBody"></tbody>
    </table>
  </div>

</main>

<script>
const API = "http://localhost:8000";
let pollTimer = null;

async function checkHealth(){
  try{
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    document.getElementById("health").textContent =
      `backend:${d.backend} · browser:${d.browser_available} · rag:${d.rag_available}`;
  }catch(e){
    document.getElementById("health").textContent = "backend unreachable";
  }
}
checkHealth();

document.getElementById("startBtn").addEventListener("click", startScan);

async function startScan(){
  const url = document.getElementById("url").value.trim();
  if(!url){ alert("Enter a website URL"); return; }
  const btn = document.getElementById("startBtn");
  btn.disabled = true; btn.textContent = "⟳ Scanning…";

  document.getElementById("logPanel").style.display = "block";
  document.getElementById("log").innerHTML = "";
  document.getElementById("bugsPanel").style.display = "none";
  document.getElementById("scoreboard").style.display = "none";

  const body = {
    url,
    max_pages: parseInt(document.getElementById("maxPages").value || "8", 10),
    max_depth: parseInt(document.getElementById("maxDepth").value || "2", 10),
    device: document.getElementById("device").value,
  };

  try{
    const res = await fetch(`${API}/api/scan`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    pollScan(data.scan_id);
  }catch(e){
    alert("Could not reach backend at " + API + ". Is uvicorn running?");
    btn.disabled = false; btn.textContent = "▶ Start Autonomous QA Scan";
  }
}

function pollScan(scanId){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const res = await fetch(`${API}/api/scan/${scanId}`);
    const state = await res.json();
    renderLog(state.agent_log);

    if(state.scan_status === "completed" || state.scan_status === "failed"){
      clearInterval(pollTimer);
      const btn = document.getElementById("startBtn");
      btn.disabled = false; btn.textContent = "▶ Start Autonomous QA Scan";
      if(state.scan_status === "completed"){
        renderScore(state.quality_score);
        renderBugs(state.bugs);
      } else {
        alert("Scan failed: " + state.error);
      }
    }
  }, 1500);
}

function renderLog(entries){
  const el = document.getElementById("log");
  el.innerHTML = entries.slice().reverse().map(e => `
    <div class="log-entry">
      <span class="icon status-${e.status}">${iconFor(e.status)}</span>
      <span class="agent">${e.agent}</span>
      <span class="task">${e.task}${e.detail ? `<span class="detail">${escapeHtml(e.detail)}</span>` : ""}</span>
      <span class="ts">${new Date(e.timestamp).toLocaleTimeString()}</span>
    </div>
  `).join("");
}

function iconFor(status){
  return {running:"⟳", success:"✓", warning:"⚠", failed:"✕"}[status] || "○";
}

function renderScore(score){
  if(!score) return;
  const board = document.getElementById("scoreboard");
  const row = document.getElementById("scoreRow");
  board.style.display = "block";
  const items = [
    ["overall","Overall Quality"],
    ["functional","Functional"],
    ["accessibility","Accessibility"],
    ["pages_scanned","Pages Scanned"],
    ["tests_generated","Tests Generated"],
    ["tests_passed","Tests Passed"],
    ["bugs_found","Bugs Found"],
  ];
  row.innerHTML = items.map(([key,label]) => `
    <div class="score-card">
      <div class="num">${score[key]}</div>
      <div class="label">${label}</div>
    </div>
  `).join("");
}

function renderBugs(bugs){
  const panel = document.getElementById("bugsPanel");
  const body = document.getElementById("bugsBody");
  panel.style.display = "block";
  if(!bugs.length){
    body.innerHTML = `<tr><td colspan="5" class="empty">No bugs detected.</td></tr>`;
    return;
  }
  const order = {CRITICAL:0, HIGH:1, MEDIUM:2, LOW:3, INFO:4};
  bugs.sort((a,b) => order[a.severity]-order[b.severity]);
  body.innerHTML = bugs.map(b => `
    <tr>
      <td><span class="sev sev-${b.severity}">${b.severity}</span></td>
      <td>${escapeHtml(b.title)}</td>
      <td>${b.category}</td>
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(b.page)}</td>
      <td>${escapeHtml(b.severity_rationale)}</td>
    </tr>
  `).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
